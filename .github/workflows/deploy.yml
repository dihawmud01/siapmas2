name: Deploy via FTP to shared Hosting

on:
    push:
        branches:
            - production # Workflow ini hanya jalan otomatis jika ada push ke branch production

jobs:
    web-deploy:
        runs-on: ubuntu-latest
        steps:
            # 1. Mengambil kode terbaru dari Github
            - name: 🚚 Get latest code
              uses: actions/checkout@v4

            # 2. Setup Node.js dan install dependensi JS (untuk aset Vite/Tailwind/dsb)
            - name: 🛠️ Setup Node & Build Assets
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - run: npm install
            - run: npm run build

            # 3. Sinkronisasi Ruang Kode (Core App) ke folder "siapmas"
            - name: 🚀 Sync Core App to Server
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  server-dir: ${{ secrets.FTP_CORE_DIR }}
                  exclude: |
                      **/.git*
                      **/.git*/**
                      **/node_modules/**
                      .env
                      storage/logs/**
                      public/**

            # 4. Sinkronisasi Ruang Publik (Web Assets) ke folder "public_html"
            - name: 🚀 Sync Public Assets to Server
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  local-dir: ./public/
                  server-dir: ${{ secrets.FTP_PUBLIC_DIR }}
                  exclude: |
                      storage/**
                      index.php
                      build/manifest.json
