name: Deploy ke Shared Hosting via FTP

on:
    push:
        branches:
            - production # Workflow ini hanya jalan otomatis jika ada push ke branch production

jobs:
    web-deploy:
        runs-on: ubuntu-latest
        steps:
            # 1. Mengambil kode terbaru dari Github
            - name: 🚚 Get latest code
              uses: actions/checkout@v4

            # 2. Setup Node.js dan install dependensi JS (untuk aset Vite/Tailwind/dsb)
            - name: 🛠️ Setup Node & Build Assets
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - run: npm install
            - run: npm run build

            # 3. Sinkronisasi (Upload) otomatis file ke Hosting via FTP
            - name: 🚀 Sync files to Server
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  # Jangan hapus file penting server seperti folder storage dan konfigurasi environment env
                  # File/Folder dalam list `exclude` di bawah ini TIDAK AKAN DITIMPA (Upload) dan TIDAK AKAN DIHAPUS
                  exclude: |
                      **/.git*
                      **/.git*/**
                      **/node_modules/**
                      .env
                      storage/app/public/**
                      storage/logs/**
